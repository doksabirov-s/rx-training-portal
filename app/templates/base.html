<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RX Training Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark rxp-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5" href="/">
                <i class="bi bi-capsule-pill me-2"></i>RX Training Portal
            </a>
            <span class="navbar-text text-white-50 small d-none d-md-inline">
                Powered by NotebookLM
            </span>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto py-3 border-top text-center text-muted small">
        RX Training Portal &mdash; AI-powered pharmaceutical learning
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
